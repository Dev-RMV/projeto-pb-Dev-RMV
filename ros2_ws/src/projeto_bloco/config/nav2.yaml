# Nav2 (Humble) para o Robo Sniper no Gazebo: localizacao AMCL no mapa salvo, costmaps global e
# local com o lidar, planejador global NavFn e controlador local DWB.
# Base: nav2_bringup/params/nav2_params.yaml, ajustado ao robo (esteiras, 0,27 x 0,23 m, lidar de
# 360 graus a 10 Hz, frame base_footprint) e a sala de 6 x 6 m. Carregado pelo
# navegacao.launch.py (argumento nav_params:=), que o repassa ao nav2_bringup/bringup_launch.py;
# o use_sim_time e o yaml_filename do mapa sao reescritos por esse launch.

# ---------- localizacao: filtro de particulas sobre o mapa ----------
amcl:
  ros__parameters:
    use_sim_time: True
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: scan
    # Modelo de movimento OMNIDIRECIONAL, nao o diferencial: ao girar no lugar a esteira escorrega
    # de lado (ate 6 cm/s no Gazebo) e o centro do robo anda alguns milimetros para o lado a cada
    # atualizacao. O modelo diferencial supoe que o robo so anda para onde aponta e le esse passo
    # lateral como "girar 90 graus, andar, girar de volta": com isso o ruido das particulas saltava
    # para 1,4 m e 110 graus num unico giro e a localizacao se perdia. O modelo omnidirecional tem
    # um termo proprio para o deslocamento lateral e o ruido fica proporcional ao movimento real.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2                  # translacao (frente e lado) causada por rotacao
    alpha2: 0.2                  # rotacao causada por translacao
    alpha3: 0.2                  # translacao causada por translacao
    alpha4: 0.2                  # rotacao causada por rotacao
    alpha5: 0.2                  # deslocamento lateral causado por translacao
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0        # alcance do lidar do URDF
    laser_min_range: -1.0        # -1 = o minimo que vem no proprio /scan
    max_beams: 90                # 1 a cada 4 graus dos 360 feixes
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    update_min_d: 0.10           # robo e sala pequenos: corrige a cada 10 cm ou ~6 graus
    update_min_a: 0.10
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    save_pose_rate: 0.5
    tf_broadcast: true           # publica map -> odom
    transform_tolerance: 1.0
    # pose inicial conhecida: o robo nasce na origem do mundo, que e a origem do mapa
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

# ---------- navegador: a behavior tree interna do Nav2 (planejar, seguir, recuperar) ----------
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Arvore interna do Nav2: replaneja so quando o caminho fica INVALIDO (obstaculo novo no
    # costmap global) ou o goal muda, em vez de replanejar a cada 1 s (arvore padrao,
    # navigate_to_pose_w_replanning_and_recovery.xml). Motivo: cada caminho novo zera o estado do
    # DWB. Com um caminho novo por segundo, o robo que ja tinha chegado e estava girando para a
    # orientacao do goal "esquecia" a chegada; como a esteira desloca o centro do robo em ate
    # 10 cm ao girar no lugar, ele saia da tolerancia e o DWB passava a alternar entre voltar ao
    # ponto e girar para o goal, em sentidos opostos (Failed to make progress). O desvio de
    # obstaculos continua: a caixa que aparece invalida o caminho e o planejador e chamado.
    # A pausa por obstaculo a 0,5 m e decidida fora daqui, no no arvore_navegacao do projeto.
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

# ---------- controlador local (Rotation Shim + DWB): alinha, segue o caminho e desvia do que o
#            costmap local mostra ----------
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2    # trechos curtos e giros no lugar: 20 cm em 15 s bastam
      movement_time_allowance: 15.0
    # Verificador de chegada com MAIS folga de posicao que o DWB (FollowPath.xy_goal_tolerance,
    # 0,12 m). Com as duas tolerancias iguais havia uma corrida: o robo entrava na tolerancia no
    # limite, o DWB parava para girar ate a orientacao do goal, mas este verificador nao chegava a
    # marcar a posicao como alcancada; o robo acertava a orientacao, ficava parado a 0,19 m e o
    # Nav2 acusava "Failed to make progress" 15 s depois. Com 0,25 m aqui, quando o DWB para o
    # verificador ja marcou a posicao (stateful) e so falta conferir a orientacao.
    general_goal_checker:
      stateful: True                   # chegou na posicao uma vez: dali em diante so confere o yaw
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.15         # ~9 graus (a torre corrige o resto)
    FollowPath:
      # Rotation Shim: no inicio de cada caminho o robo gira NO LUGAR ate ficar a menos de 45
      # graus da direcao do caminho e so entao passa o controle ao DWB. E o jeito natural de uma
      # esteira sair de um posto (os postos pedem giros de 80 a 200 graus) e evita os arcos largos
      # que o DWB faz quando comeca de costas para o caminho.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.785    # 45 graus
      forward_sampling_distance: 0.5   # ponto do caminho usado para medir a direcao
      rotate_to_heading_angular_vel: 0.9
      max_angular_accel: 3.0
      simulate_ahead_time: 1.0         # checa colisao do giro no costmap local
      # ---- DWB (controlador primario) ----
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25                  # a mesma velocidade do piloto_demo do TP3
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -2.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 20
      vy_samples: 1                    # esteira: nao anda de lado
      vtheta_samples: 30
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.12          # o DWB para de andar e passa a girar para o yaw do goal
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ---------- costmap local: janela de 3 x 3 m que anda com o robo (frame odom), so com o lidar ----------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.20               # circulo que envolve o chassi (0,27 x 0,23 m) com a camera
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True               # o feixe que passa limpa a celula (obstaculo que saiu)
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.40
      always_send_full_costmap: True

# ---------- costmap global: mapa salvo + o que o lidar ve agora (obstaculos fora do mapa) ----------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.20
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.40
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""                  # vem do argumento mapa:= do navegacao.launch.py

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# ---------- planejador global: menor caminho no costmap global ----------
planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: false                 # Dijkstra
      allow_unknown: true              # ha sombras sem mapa atras dos obstaculos

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# ---------- comportamentos de recuperacao usados pela arvore interna do Nav2 ----------
behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ---------- suavizador: limita a aceleracao do /cmd_vel que vai para as esteiras ----------
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.0]
    min_velocity: [-0.25, 0.0, -1.0]
    max_accel: [1.5, 0.0, 3.0]
    max_decel: [-2.0, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
