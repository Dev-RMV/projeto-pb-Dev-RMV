# Parametros de todos os nos do projeto_bloco (carregados pelos launch files).
# Em execucao:  ros2 param set /no nome valor   |   ros2 param load /no este_arquivo.yaml
# (parametro double exige ponto decimal na linha de comando: 5.0, nao 5)
# Nomes dos nos com a barra inicial (/no): o `ros2 param load` do Humble so aceita o nome completo.

/camera_publisher:
  ros__parameters:
    source: ""            # "0" = /dev/video0, ou caminho de video (TP2: ros2_ws/midia/alvos_dv20.mp4)
    fps: 0.0              # 0 = FPS da fonte
    frame_id: "camera_optical_link"   # frame da camera no URDF

# ---------- TP1: segmentacao por cor e rostos ----------
# Faixas HSV no espaco do OpenCV: H 0-179, S 0-255, V 0-255.
/color_segmenter:
  ros__parameters:
    # lista de cores a segmentar; cada uma precisa de <cor>.lower e <cor>.upper ([H,S,V]).
    # Se lower[H] > upper[H] a faixa "da a volta" pelo 0 (vermelho).
    cores: ["azul", "vermelho", "verde", "amarelo"]
    azul:     {lower: [100, 90, 60],  upper: [125, 255, 255]}   # bola e camiseta do demo.mp4
    vermelho: {lower: [170, 100, 70], upper: [10, 255, 255]}
    verde:    {lower: [35, 60, 40],   upper: [85, 255, 255]}
    amarelo:  {lower: [20, 100, 100], upper: [35, 255, 255]}
    # laranja: {lower: [5, 100, 70], upper: [20, 255, 255]}   # no demo.mp4 pega pele e o piso ao sol
    min_area: 1500               # area minima (px) para contar como objeto
    show: false

/face_features:
  ros__parameters:
    min_face_size: 30            # pixels
    show: false

# ---------- TP2: rastreamento de alvos (YOLO) + action de engajamento ----------
/rastreador_yolo:
  ros__parameters:
    # YOLOv8s treinado para a classe "alvo" (alvo de tiro impresso; dataset sintetico no Blender).
    # Nome sem caminho: procurado em share/projeto_bloco/modelos e senao em pasta_modelos, onde os
    # pesos oficiais da Ultralytics (ex.: yolo11n.pt, COCO) sao baixados na 1a vez; ou um caminho.
    modelo: "alvo_yolov8s_640.pt"
    pasta_modelos: "~/.cache/projeto_bloco/modelos"
    confianca: 0.5               # limiar de confianca (0.05-0.95); melhor F1 na validacao: 0.57
    iou: 0.5                     # limiar de IoU da supressao de nao-maximos
    frequencia_hz: 10.0          # inferencia + publicacao de /vision/deteccoes (0.5-30)
    classes: ["alvo"]            # nomes de classe do modelo; ["*"] = todas
    dispositivo: "cpu"           # "cuda:0" exige torch com CUDA (o setup.sh instala o de CPU)
    imgsz: 640                   # o modelo foi treinado com 640
    threads_cpu: 4               # threads do torch (16+ disputam CPU com os outros nos)
    kalman:
      sigma_a: 200.0             # ruido de aceleracao (px/s^2): maior = segue mais rapido
      sigma_z: 15.0              # ruido de medicao (px): maior = trilha mais suave
    trilha_max: 40               # pontos por trilha desenhada
    perda_max_s: 1.0             # id sem deteccao por mais que isso e descartado
    # show (janela cv2.imshow) vem do argumento show:= do launch

/servidor_engajar:
  ros__parameters:
    taxa_controle_hz: 10.0       # ciclos de controle e de feedback por segundo
    hfov_graus: 70.0             # campo de visao horizontal da camera (DV20 / video de alvos)
    kp: 4.0                      # ganho proporcional da torre (1/s)
    vel_max_graus_s: 90.0        # velocidade maxima das juntas pan e tilt
    pan_limite_graus: 170.0      # limites iguais aos do URDF
    tilt_min_graus: -40.0        # tilt negativo = cano para cima
    tilt_max_graus: 20.0
    tempo_perda_s: 0.5           # alvo sumido ha menos que isso: segue a predicao do Kalman
    # padroes para campos do goal enviados como 0
    confianca_min: 0.5
    tolerancia_px: 15.0
    tempo_travar_s: 0.5
    tempo_max_s: 30.0
    armada_inicial: false        # trava de seguranca: comeca desarmada (/arma/controle arma)
    taxa_visao_hz: 10.0          # publicacao de /torre/visao
    # show (janela cv2.imshow com a mira) vem do argumento show:= do launch

# ---------- TP3: segmentacao por instancia e piloto da demo (bringup com Gazebo + SLAM) ----------
/segmentador_yolo:
  ros__parameters:
    # YOLOv8n-seg treinado para a classe "alvo" (mesmo dataset sintetico do detector, com os
    # poligonos do contorno do alvo); entrada 416 px. Nome sem caminho: como no rastreador.
    modelo: "alvo_yolov8n_seg_416.pt"
    pasta_modelos: "~/.cache/projeto_bloco/modelos"
    confianca: 0.3               # limiar de maior F1 do v8n-seg na validacao sintetica
    iou: 0.5
    frequencia_hz: 5.0           # inferencia + publicacao de /vision/segmented (0.2-30)
    imgsz: 416                   # o modelo foi treinado com 416
    dispositivo: "cpu"
    threads_cpu: 4
    alpha: 0.5                   # transparencia das mascaras sobre o frame
    topico_entrada: "/camera/image_raw"
    # show (janela cv2.imshow) vem do argumento show:= do launch

/piloto_demo:
  ros__parameters:
    # quadrado de 1,4 m no quadrante +x/+y da sala (sala_alvos.world) e um giro completo no fim,
    # para o lidar varrer tudo; os obstaculos do mundo ficam a mais de 0,5 m desta rota
    rota: ["parar 3", "reto 1.4 0.25", "girar 90 45", "reto 1.4 0.25", "girar 90 45",
           "reto 1.4 0.25", "girar 90 45", "reto 1.4 0.25", "girar 90 45", "girar 360 30"]
    repetir: 1
    espera_inicial_s: 30.0       # Gazebo e SLAM assentam e o cliente_engajar do reproduzir.sh engaja
                                 # um alvo com o robo ainda parado olhando para os alvos
    taxa_hz: 20.0

/cliente_engajar:
  ros__parameters:
    classes: ["alvo"]            # um goal por item, em sequencia
    confianca_min: 0.0           # campos do goal; 0 = padrao do servidor
    tolerancia_px: 0.0
    tempo_travar_s: 0.0
    tempo_max_s: 0.0
    cancelar_apos_s: 0.0         # > 0: cancela cada goal depois desse tempo
    armar: true                  # chama /arma/controle antes dos goals
    intervalo_s: 2.0
    arquivo_csv: ""              # "" = so log
